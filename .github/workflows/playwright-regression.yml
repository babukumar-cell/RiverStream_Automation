name: River Stream Regression Suite

on:
  schedule:
    # Runs weekly every Monday at 05:00 UTC (10:30 AM IST)
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test Suite to Execute'
        required: true
        default: 'test:main'
        type: choice
        options:
          - 'test:main'       # Every module
          - 'test:auth'
          - 'test:left-side'
          - 'test:clients'
          - 'test:analytics'
          - 'test:upload'
          - 'test:documents'
          - 'test:recon'
          - 'test:review'
          - 'test:settings'
          - 'test:email'
      report_recipients:
        description: 'Override Email Recipients (comma-separated, optional)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  secret-scan:
    name: Scan for Committed Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  regression-tests:
    name: Execute Playwright Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Type Check
        run: npm run typecheck

      - name: Install Playwright Browsers & System Dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Regression Tests
        id: run_tests
        continue-on-error: true
        env:
          CI: true
          HEADLESS: true
          BASE_URL: ${{ secrets.BASE_URL || 'https://riverstream-qa.azurewebsites.net/' }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_APP_PASSWORD: ${{ secrets.SENDER_APP_PASSWORD }}
          INGESTION_EMAIL: ${{ secrets.INGESTION_EMAIL || 'riverstream.qa@riverstonetech.in' }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: 465
          IMAP_HOST: imap.gmail.com
          IMAP_PORT: 993
        run: |
          SUITE="${{ github.event.inputs.test_suite }}"
          if [ -z "$SUITE" ]; then
            SUITE="test:main"
          fi
          echo "Executing test suite: npm run $SUITE"
          npm run "$SUITE"

      - name: Generate Allure Report
        if: always()
        run: |
          npm run allure:generate || echo "Allure generation skipped or completed with warnings"

      - name: Build Elegant Dark HTML Report
        if: always()
        run: |
          npm run report:build

      # Reports contain screenshots of customer data, so they are kept as private
      # workflow artifacts instead of being published to GitHub Pages.
      - name: Upload Test Results & Artifacts
        id: upload_artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-execution-artifacts-${{ github.run_number }}
          path: |
            playwright-report/
            reports/
            test-results/
            allure-report/
          retention-days: 14

      - name: Send Execution Email Report
        if: always()
        env:
          BASE_URL: ${{ secrets.BASE_URL || 'https://riverstream-qa.azurewebsites.net/' }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_APP_PASSWORD: ${{ secrets.SENDER_APP_PASSWORD }}
          REPORT_RECIPIENTS: ${{ github.event.inputs.report_recipients || secrets.REPORT_RECIPIENTS }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: 465
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          REPORT_WEB_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          npm run report:email

      - name: Check Overall Test Run Status
        if: steps.run_tests.outcome != 'success'
        run: |
          echo "Playwright tests encountered failures. Check the summary email and the run artifacts."
          exit 1
