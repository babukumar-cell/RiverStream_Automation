name: River Stream Regression Suite

on:
  schedule:
    # Runs weekly every Monday at 05:00 UTC (10:30 AM IST) so test suite finishes and report email arrives by 11:00 AM IST
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test Suite to Execute'
        required: true
        default: 'test:main'
        type: choice
        options:
          - 'test:main'      # Core 7 modules (Auth, LeftNav, Upload, Docs, Recon, Review, Email)
          - 'test:full'      # All 8 modules including Settings (273 tests)
          - 'test:settings'  # Standalone Settings module (82 tests)
      report_recipients:
        description: 'Override Email Recipients (comma-separated, optional)'
        required: false
        default: ''

permissions:
  contents: write
  actions: read

jobs:
  regression-tests:
    name: Execute Playwright Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers & System Dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Regression Tests
        id: run_tests
        continue-on-error: true
        env:
          CI: true
          HEADLESS: true
          BASE_URL: ${{ secrets.BASE_URL || 'https://riverstream-qa.azurewebsites.net/' }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_APP_PASSWORD: ${{ secrets.SENDER_APP_PASSWORD }}
          INGESTION_EMAIL: ${{ secrets.INGESTION_EMAIL || 'riverstream.qa@riverstonetech.in' }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: 465
          IMAP_HOST: imap.gmail.com
          IMAP_PORT: 993
        run: |
          SUITE="${{ github.event.inputs.test_suite }}"
          if [ -z "$SUITE" ]; then
            SUITE="test:main"
          fi
          echo "Executing test suite: npm run $SUITE"
          npm run "$SUITE"

      - name: Generate Allure Report
        if: always()
        run: |
          npm run allure:generate || echo "Allure generation skipped or completed with warnings"

      - name: Build Elegant Dark HTML Report
        if: always()
        run: |
          npm run report:build

      - name: Deploy Playwright HTML Report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./playwright-report
          keep_files: false

      - name: Send Execution Email Report
        if: always()
        env:
          BASE_URL: ${{ secrets.BASE_URL || 'https://riverstream-qa.azurewebsites.net/' }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_APP_PASSWORD: ${{ secrets.SENDER_APP_PASSWORD }}
          REPORT_RECIPIENTS: ${{ github.event.inputs.report_recipients || secrets.REPORT_RECIPIENTS || secrets.SENDER_EMAIL }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: 465
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          REPORT_WEB_URL: https://babukumar-cell.github.io/RiverStream_Automation/
        run: |
          npm run report:email

      - name: Upload Test Results & Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-execution-artifacts-${{ github.run_number }}
          path: |
            playwright-report/
            test-results/
            allure-report/
          retention-days: 14

      - name: Check Overall Test Run Status
        if: steps.run_tests.outcome != 'success'
        run: |
          echo "Playwright tests encountered failures. Check the attached summary email and artifacts."
          exit 1
